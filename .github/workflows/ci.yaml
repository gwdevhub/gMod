name: gMod CI Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the pinned llvm-mingw, CMake and vcpkg, then configures the release preset.
      - name: Bootstrap
        run: bash bootstrap.sh

      - name: Build
        run: python3 scripts/build.py --preset release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gMod-linux-release
          path: |
            bin/gMod.dll
            bin/gMod.pdb
            bin/TpfConvert.exe
            bin/TpfConvert.pdb
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Windows host builds the same way as Linux; bootstrap.bat would stop at a pause, so run the steps it
      # wraps. CMake and llvm-mingw are pinned and installed by bootstrap.py. vcpkg's own pkgconf download points at an
      # msys2 package the mirrors no longer serve, so vcpkg uses the pkgconf and ninja installed here instead.
      - name: Install Ninja and pkgconf
        run: |
          choco install ninja pkgconfiglite -y --no-progress
          # The shims are in chocolatey\bin, which later steps do not see on PATH unless it is added to GITHUB_PATH.
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Bootstrap
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: "1"
        run: python scripts\bootstrap.py

      - name: Build
        run: python scripts\build.py --preset release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gMod-windows-release
          path: |
            bin\gMod.dll
            bin\gMod.pdb
            bin\TpfConvert.exe
            bin\TpfConvert.pdb
          if-no-files-found: error
