name: gMod CI Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the pinned llvm-mingw, CMake and vcpkg, then configures the release preset.
      - name: Bootstrap
        run: bash bootstrap.sh

      - name: Build
        run: python3 scripts/build.py --preset release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gMod-linux-release
          path: |
            bin/gMod.dll
            bin/gMod.pdb
            bin/TpfConvert.exe
            bin/TpfConvert.pdb
          if-no-files-found: error

