name: gMod CI Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs the pinned llvm-mingw, CMake and vcpkg, then configures the release preset.
      - name: Bootstrap
        run: bash bootstrap.sh

      - name: Build
        run: python3 scripts/build.py --preset release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gMod-linux-release
          path: |
            bin/gMod.dll
            bin/gMod.pdb
            bin/TpfConvert.exe
            bin/TpfConvert.pdb
          if-no-files-found: error

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Windows host builds the same way as Linux; bootstrap.bat would stop at a pause, so run the steps it
      # wraps. Ninja comes from pip. CMake and llvm-mingw are pinned and installed by bootstrap.py.
      - name: Install Ninja
        run: python -m pip install ninja

      - name: Bootstrap
        run: python scripts\bootstrap.py

      - name: Build
        run: python scripts\build.py --preset release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: gMod-windows-release
          path: |
            bin\gMod.dll
            bin\gMod.pdb
            bin\TpfConvert.exe
            bin\TpfConvert.pdb
          if-no-files-found: error
